---
# defaults file for vmware_provision

# Thong so ha tang ao hoa mac dinh
vm_datacenter: "Amigo"
vm_cluster: "Amigo 2"
vm_resource_pool: "Software-2"
vm_datastore: "vsanDatastore"
vm_folder: "/vm/Software-2"
vm_network: "192.168.50.0"
vm_dvswitch_name: "" # Điền tên DVS Switch của bạn nếu gặp lỗi quét cạc mạng DVS (ví dụ: "DSwitch")
vm_module_type: "certified"

# Thong so ma ID (MOID) cho module REST (Co thu muc rieng, mac dinh tu dong map sang ten neu de trong)
vm_cluster_id: ""
vm_datastore_id: ""
vm_folder_id: ""
vm_resource_pool_id: ""
vm_network_id: ""
# Thong so phan cung may ao mac dinh
vm_name: "amigo-web-temp"
vm_cpu: 2
vm_ram_mb: 4096
vm_disk_gb: 50
vm_state: "poweredon"

# Duong dan file ISO he dieu hanh tren vCenter Datastore
vm_iso_path: "[vsanDatastore] b4b80e6a-0a46-ae2f-9e7e-6c92cf75ed90/rhel-9.3-x86_64-dvd.iso"

# Duong dan file ISO Kickstart (OEMDRV) tren vCenter Datastore (de trong neu khong dung kickstart)
vm_kickstart_iso_path: ""
...
