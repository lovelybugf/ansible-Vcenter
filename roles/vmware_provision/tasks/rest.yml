---
- name: "Preflight: Hien thi cac thong tin ID (MOIDs) tuong ung se dung de tao VM"
  ansible.builtin.debug:
    msg:
      - "--- THONG TIN ID GIAO DIEN vCENTER ---"
      - "Cluster ID: {{ vm_cluster_id | default(vm_cluster, true) }}"
      - "Datastore ID: {{ vm_datastore_id | default(vm_datastore, true) }}"
      - "Folder ID: {{ vm_folder_id | default(vm_folder, true) }}"
      - "Resource Pool ID: {{ vm_resource_pool_id | default(vm_resource_pool, true) }}"
      - "Network ID: {{ vm_network_id | default(vm_network, true) }}"

- name: "Task 1: Thuc hien khoi tao may ao moi tren vCenter bang module VMWARE_REST (Idempotent)"
  vmware.vmware_rest.vcenter_vm:
    placement:
      cluster: "{{ vm_cluster_id | default(vm_cluster, true) }}"
      datastore: "{{ vm_datastore_id | default(vm_datastore, true) }}"
      folder: "{{ vm_folder_id | default(vm_folder, true) }}"
      resource_pool: "{{ vm_resource_pool_id | default(vm_resource_pool, true) }}"
    name: "{{ vm_name }}"
    guest_OS: RHEL_9_64
    hardware_version: VMX_19
    cpu:
      count: "{{ vm_cpu | int }}"
      cores_per_socket: 1
    memory:
      size_MiB: "{{ vm_ram_mb | int }}"
    disks:
      - type: SCSI
        scsi:
          bus: 0
          unit: 0
        new_vmdk:
          name: "system_disk"
          capacity: "{{ (vm_disk_gb | int) * 1024 * 1024 * 1024 }}"
    nics:
      - type: VMXNET3
        start_connected: true
        allow_guest_control: false
        backing:
          type: 'DISTRIBUTED_PORTGROUP'
          network: "{{ vm_network_id | default(vm_network, true) }}"
  register: create_vm_result

- name: "Task 2: Hien thi ket qua khoi tao"
  ansible.builtin.debug:
    msg:
      - "Khoi tao may ao qua VMWARE_REST module: {{ vm_name }} thanh cong!"
      - "ID may ao duoc cap: {{ create_vm_result.id | default('Unknown') }}"
...
