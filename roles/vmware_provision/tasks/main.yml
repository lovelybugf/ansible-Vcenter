---
# tasks file for vmware_provision
- name: "Task 1: Thuc hien khoi tao may ao moi tren vCenter (Idempotent)"
  community.vmware.vmware_guest:
    hostname: "{{ vcenter_hostname }}"
    username: "{{ vcenter_username }}"
    password: "{{ vcenter_password }}"
    validate_certs: "{{ vcenter_validate_certs }}"
    datacenter: "{{ vm_datacenter }}"
    cluster: "{{ vm_cluster }}"
    datastore: "{{ vm_datastore }}"
    folder: "{{ vm_folder }}"
    name: "{{ vm_name }}"
    state: "{{ vm_state }}"
    guest_id: "rhel9_64Guest"
    hardware:
      memory_mb: "{{ vm_ram_mb }}"
      num_cpus: "{{ vm_cpu }}"
      scsi: "paravirtual"
    disk:
      - size_gb: "{{ vm_disk_gb }}"
        type: "thin"
        datastore: "{{ vm_datastore }}"
    networks:
      - name: "{{ vm_network }}"
        start_connected: true
    state_change_timeout: 300
  register: create_vm_result

- name: "Task 2: Hien thi ket qua khoi tao va IP cua may ao moi"
  ansible.builtin.debug:
    msg:
      - "Khoi tao may ao: {{ vm_name }} thanh cong!"
      - "Trang thai hien tai: {{ create_vm_result.instance.hw_power_status | default('Unknown') }}"
      - "He dieu hanh: {{ create_vm_result.instance.hw_guest_full_name | default('Unknown') }}"
...
