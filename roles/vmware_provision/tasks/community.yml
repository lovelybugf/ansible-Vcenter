---
- name: "Task 1: Thuc hien khoi tao may ao moi tren vCenter bang module Community (Idempotent)"
  community.vmware.vmware_guest:
    name: "{{ vm_name }}"
    datacenter: "{{ vm_datacenter }}"
    cluster: "{{ vm_cluster }}"
    datastore: "{{ vm_datastore }}"
    folder: "{{ vm_folder }}"
    resource_pool: "{{ vm_resource_pool }}"
    state: "poweredon"
    guest_id: "rhel9_64Guest"
    hardware:
      memory_mb: "{{ vm_ram_mb | int }}"
      num_cpus: "{{ vm_cpu | int }}"
      scsi: "paravirtual"
    disk:
      - size_gb: "{{ vm_disk_gb | int }}"
        type: "thin"
        datastore: "{{ vm_datastore }}"
    networks:
      - name: "{{ vm_network }}"
        dvswitch_name: "{{ vm_dvswitch_name | default(omit, true) }}"
        device_type: "vmxnet3"
        start_connected: true
        connected: true
  register: create_vm_result

- name: "Task 2: Hien thi ket qua khoi tao va trang thai"
  ansible.builtin.debug:
    msg:
      - "Khoi tao may ao: {{ vm_name }} thanh cong!"
      - "Trang thai hien tai: {{ create_vm_result.instance.hw_power_status | default('Unknown') }}"
      - "He dieu hanh: {{ create_vm_result.instance.hw_guest_full_name | default('Unknown') }}"
...
