---
# Inventory plugin mới chuẩn Red Hat AAP / AWX: vmware.vmware.vms
plugin: vmware.vmware.vms
strict: false
validate_certs: false

# Thu thập tags và thuộc tính mở rộng của vCenter
gather_tags: true

# Các thuộc tính vCenter cần thu thập
properties:
  - name
  - config.name
  - guest.guestId
  - summary.runtime.powerState

compose:
  ansible_user: "'root'"
  ansible_connection: "'ssh'"

# Tự động phân nhóm máy ảo theo trạng thái và loại OS
keyed_groups:
  - key: summary.runtime.powerState
    prefix: power_state
  - key: guest.guestId
    prefix: os_type

# Bộ lọc: Loại bỏ các VM KHÔNG chứa chữ 'nampd' trong tên (chỉ giữ lại VM của nampd)
filter_expressions:
  - "'nampd' not in name.lower()"
...
