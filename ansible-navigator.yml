---
ansible-navigator:
  execution-environment:
    container-engine: podman
    enabled: true
    image: quay.io/nam_pdrhpc75342/ducnam-repo:v1.3
    pull:
      policy: missing
    environment-variables:
      pass:
        - VMWARE_HOST
        - VMWARE_USER
        - VMWARE_PASSWORD
      set:
        ANSIBLE_COLLECTIONS_PATH: "/usr/share/ansible/collections"
  mode: stdout

  playbook-artifact:
    enable: false
...
