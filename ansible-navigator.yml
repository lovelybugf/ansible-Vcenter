---
ansible-navigator:
  execution-environment:
    container-engine: podman
    enabled: true
    image: quay-ssc2.local.amigo.com/admin/nampd-vmware-ee:4.8.5
    pull:
      # The private registry uses an internal CA. Pull this image with
      # scripts/pull-ee before its first use.
      policy: never
    environment-variables:
      pass:
        - VMWARE_HOST
        - VMWARE_USER
        - VMWARE_PASSWORD
      set:
        ANSIBLE_COLLECTIONS_PATH: "/usr/share/ansible/collections"
  mode: stdout

  playbook-artifact:
    enable: false
...
