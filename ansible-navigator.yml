---
ansible-navigator:
  execution-environment:
    container-engine: podman
    enabled: true
    image: quay-ssc2.local.amigo.com/admin/nampd-vmware-ee:v1.2
    pull:
      policy: missing
    environment-variables:
      pass:
        - VMWARE_HOST
        - VMWARE_USER
        - VMWARE_PASSWORD
      set:
        ANSIBLE_COLLECTIONS_PATH: "/usr/share/ansible/collections"
  mode: stdout

  playbook-artifact:
    enable: false
...
