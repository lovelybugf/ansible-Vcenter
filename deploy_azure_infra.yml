---
# ==============================================================================
# ANSIBLE PLAYBOOK: ĐIỀU PHỐI TERRAFORM TRIỂN KHAI HẠ TẦNG TRÊN AZURE
# Yêu cầu chạy bằng Execution Environment (v1.3 trở lên) đã cài sẵn Terraform CLI
# Lệnh chạy trên AWX hoặc CLI: ansible-playbook deploy_azure_infra.yml
# ==============================================================================

- name: "Ansible điều khiển Terraform triển khai hạ tầng Azure"
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    terraform_project_path: "./terraform-azure"
    resource_group_name: "rg-ansible-terraform-demo"
    azure_location: "East US"

  tasks:
    - name: "1. Đảm bảo thư mục dự án Terraform tồn tại"
      ansible.builtin.stat:
        path: "{{ terraform_project_path }}"
      register: project_dir

    - name: "Kiểm tra sự tồn tại của thư mục"
      ansible.builtin.fail:
        msg: "Thư mục dự án Terraform không tồn tại tại: {{ terraform_project_path }}"
      when: not project_dir.stat.exists

    - name: "2. Kích hoạt Terraform triển khai tài nguyên (Init & Apply)"
      cloud.terraform.terraform:
        project_path: "{{ terraform_project_path }}"
        state: present                  # present = apply, absent = destroy
        force_init: true                # Tự động chạy init lại nếu có thay đổi cấu hình
        variables:
          resource_group_name: "{{ resource_group_name }}"
          location: "{{ azure_location }}"
      register: tf_result

    - name: "3. Hiển thị trạng thái thay đổi hạ tầng từ Terraform"
      ansible.builtin.debug:
        msg:
          - "Trạng thái changed: {{ tf_result.changed }}"
          - "Chi tiết thay đổi: {{ tf_result.outputs | default('Không có outputs') }}"
...
