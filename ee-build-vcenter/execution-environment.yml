---
version: 3

images:
  base_image:
    name: quay.io/ansible/creator-ee:latest

options:
  package_manager_path: /usr/bin/microdnf

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.16.0,<2.17.0
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_files:
  - src: ansible.cfg
    dest: conf.d/

additional_build_steps:
  prepend_galaxy:
    - COPY _build/conf.d/ansible.cfg /home/runner/.ansible.cfg
    - COPY _build/conf.d/ansible.cfg /root/.ansible.cfg
  append_final:
    - RUN microdnf install -y unzip wget || dnf install -y unzip wget
    - RUN wget https://releases.hashicorp.com/terraform/1.8.5/terraform_1.8.5_linux_amd64.zip
    - RUN unzip terraform_1.8.5_linux_amd64.zip -d /usr/local/bin/
    - RUN rm -f terraform_1.8.5_linux_amd64.zip
    - RUN terraform --version
...
