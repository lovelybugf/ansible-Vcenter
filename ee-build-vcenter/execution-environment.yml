---
version: 3

images:
  base_image:
    name: registry.redhat.io/ansible-automation-platform-26/ee-minimal-rhel9:latest

options:
  package_manager_path: /usr/bin/microdnf

dependencies:
  ansible_core:
    package_pip: ansible-core>=2.16.0,<2.17.0
  ansible_runner:
    package_pip: ansible-runner
  galaxy: requirements.yml
  python: requirements.txt
  system: bindep.txt

additional_build_files:
  - src: ansible.cfg
    dest: conf.d/

additional_build_steps:
  prepend_galaxy:
    - COPY _build/conf.d/ansible.cfg /home/runner/.ansible.cfg
    - COPY _build/conf.d/ansible.cfg /root/.ansible.cfg
...
