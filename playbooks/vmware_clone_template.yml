---
- name: Kich ban clone may ao tu VM Template tren vCenter
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    # Thong tin VM moi se tao
    vm_name: "amigo-clone-vm-01"
    vm_datacenter: "Amigo"
    vm_cluster: "Amigo 2"
    vm_datastore: "vsanDatastore"
    vm_folder: "Software-2" # Thu muc chua VM moi tao (vi du: Software-2)

    # Thong tin VM Template goc tren vCenter
    vm_template_name: "rhel-9-template" # Dien dung ten VM Template cua ban
    vm_template_folder: "vm"            # Thu muc chua template (thuong mac dinh la 'vm')

  tasks:
    - name: "Thuc thi clone may ao tu template su dung collection Certified (vmware.vmware)"
      block:
        - name: "1. Goi deploy_folder_template de clone VM"
          vmware.vmware.deploy_folder_template:
            hostname: "{{ lookup('env', 'VMWARE_HOST') }}"
            username: "{{ lookup('env', 'VMWARE_USER') }}"
            password: "{{ lookup('env', 'VMWARE_PASSWORD') }}"
            validate_certs: "{{ lookup('env', 'VMWARE_VALIDATE_CERTS') | default(false, true) | bool }}"
            datacenter: "{{ vm_datacenter }}"
            cluster: "{{ vm_cluster }}"
            datastore: "{{ vm_datastore }}"
            folder: "{{ vm_folder }}"
            vm_name: "{{ vm_name }}"
            template_name: "{{ vm_template_name }}"
            template_folder: "{{ vm_template_folder }}"
          register: clone_result

        - name: "2. Hien thi ket qua clone may ao"
          ansible.builtin.debug:
            msg:
              - "Clone may ao tu template {{ vm_template_name }} thanh cong!"
              - "Ten may ao moi: {{ vm_name }}"
              - "ID may ao moi (MOID): {{ clone_result.vm.moid | default('Unknown') }}"

      rescue:
        - name: "3. Xu ly va canh bao khi clone gap loi"
          ansible.builtin.fail:
            msg: >
              TIEN TRINH CLONE VM BI LOI!
              Vui long kiem tra ten template '{{ vm_template_name }}', folder '{{ vm_template_folder }}'
              hoac dung luong datastore '{{ vm_datastore }}'.
...
