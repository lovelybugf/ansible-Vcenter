---
- name: Kich ban lay thong tin tai nguyen cua may ao su dung Certified module
  hosts: localhost
  gather_facts: false
  vars:
    target_vm_name: "dotv-instana_423218a1-6f21-d9f8-c316-0fcfa2ab9069"

  tasks:
    - name: "1. Goi lay thong tin tai nguyen cua may ao qua Certified module"
      vmware.vmware.vm_resource_info:
        name: "{{ target_vm_name }}"
      register: vm_resource_result

    - name: "2. Hien thi thong tin chi tiet tai nguyen thu thap duoc"
      ansible.builtin.debug:
        msg:
          - "Ten may ao: {{ item.name }}"
          - "ID (MOID): {{ item.moid }}"
          - "Trang thai CPU: Cores: {{ item.cpu.num_cpu_cores | default('N/A') }}, Sockets: {{ item.cpu.num_cpus | default('N/A') }}"
          - "Dung luong RAM: {{ item.memory.size_mb | default('N/A') }} MB"
          - "Thuoc ESXi Host: {{ item.esxi_host.name | default('N/A') }} (ID: {{ item.esxi_host.moid | default('N/A') }})"
          - "Thuoc Resource Pool: {{ item.resource_pool.name | default('N/A') }} (ID: {{ item.resource_pool.moid | default('N/A') }})"
      loop: "{{ vm_resource_result.vms }}"
      when: vm_resource_result.vms | length > 0
...
