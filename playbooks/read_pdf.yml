---
- name: Extract text from PDF inside EE
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Try to extract PDF text using python
      ansible.builtin.shell: |
        python3 -c "
        import os
        try:
            import pypdf
        except ImportError:
            import subprocess
            subprocess.run(['pip', 'install', 'pypdf'], stdout=subprocess.DEVNULL)
            import pypdf

        reader = pypdf.PdfReader('/runner/project/AU374/word_files/Blue Simple Abstract Group Project Presentation.pdf')
        text_content = []
        for i, page in enumerate(reader.pages):
            text = page.extract_text()
            text_content.append(f'=== PAGE {i+1} ===\n{text}\n')
        
        with open('/runner/project/AU374/word_files/presentation_text.txt', 'w') as f:
            f.write('\n'.join(text_content))
        print('Extraction successful!')
        "
      register: extract_result

    - name: Display result
      ansible.builtin.debug:
        var: extract_result.stdout
...
