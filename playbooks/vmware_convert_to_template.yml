---
- name: Kich ban chuyen doi may ao thanh VM Template tren vCenter
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    vm_name: "amigo-web-temp"
    vm_datacenter: "Amigo"
    vm_folder: "/Amigo/vm/Software-2" # Thu muc chua VM va Template sau khi chuyen doi

  tasks:
    - name: "Quy trinh chuyen doi VM thanh Template"
      block:
        - name: "1. Kiem tra va tat nguon may ao (Bat buoc phai tat nguon truoc khi chuyen thanh Template)"
          vmware.vmware.vm:
            hostname: "{{ lookup('env', 'VMWARE_HOST') }}"
            username: "{{ lookup('env', 'VMWARE_USER') }}"
            password: "{{ lookup('env', 'VMWARE_PASSWORD') }}"
            name: "{{ vm_name }}"
            state: "poweredoff"
          register: power_off_result

        - name: "2. Cho 10 giay de may ao tat han"
          ansible.builtin.pause:
            seconds: 10
          when: power_off_result.changed

        - name: "3. Chuyen doi VM thanh Template (Su dung module Certified)"
          vmware.vmware.folder_template_from_vm:
            datacenter: "{{ vm_datacenter }}"
            vm_name: "{{ vm_name }}"
            folder: "{{ vm_folder }}"
          register: convert_result

        - name: "4. In thong bao hoan tat"
          ansible.builtin.debug:
            msg: "May ao '{{ vm_name }}' da duoc chuyen thanh Template thanh cong tai thu muc '{{ vm_folder }}'!"

      rescue:
        - name: "Xu ly loi khi chuyen doi"
          ansible.builtin.fail:
            msg: "Chuyen doi may ao sang Template that bai! Vui long kiem tra trang thai nguon hoac duong dan folder."
...
