---
- name: Kich ban lay thong tin he thong ao hoa VMware vSphere
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../group_vars/all.yml"

  tasks:
    - name: "Goi API vCenter de lay thong tin (Co quan ly loi)"
      block:
        - name: "1. Goi lay danh sach may ao (VMs)"
          community.vmware.vmware_vm_info:
            hostname: "{{ vcenter_hostname }}"
            username: "{{ vcenter_username }}"
            password: "{{ vcenter_password }}"
            validate_certs: "{{ vcenter_validate_certs }}"
          register: vm_info

        - name: "2. Hien thi danh sach may ao rut gon"
          ansible.builtin.debug:
            msg: |
              Danh sach may ao tim thay tren vCenter:
              {% for vm in vm_info.virtual_machines %}
              - Tên: {{ vm.guest_name | default('N/A') }} (Trạng thái: {{ vm.power_state | default('N/A') }})
              {% endfor %}

      rescue:
        - name: "3. Xu ly va canh bao khi mat ket noi API vCenter"
          ansible.builtin.fail:
            msg: >
              Khong the ket noi den vCenter tai dia chi {{ vcenter_hostname }}.
              Vui long kiem tra lai ket noi mang, DNS hoac thong tin xac thuc (Credentials).
...
