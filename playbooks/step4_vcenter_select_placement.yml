---
# ==============================================================================
# BƯỚC 4: CHỌN VỊ TRÍ LƯU TRỮ VÀ CLUSTER CHO MÁY ẢO (PLACEMENT)
# Job Template AWX: 04-vCenter-Select-Placement
# Sử dụng collection: community.vmware (có sẵn trong EE v1.2)
# ==============================================================================

- name: "[STEP 4] Chọn vị trí lưu trữ VM tốt nhất"
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    target_datacenter: "{{ vm_datacenter | default('Datacenter') }}"
    target_datastore: "{{ vm_datastore | default('') }}"

  tasks:
    - name: "1. Thu thập danh sách Datastore"
      community.vmware.vmware_datastore_info:
        validate_certs: false
      register: ds_info

    - name: "2. Tự động chọn Datastore có dung lượng trống nhiều nhất (Nếu chưa chỉ định)"
      ansible.builtin.set_fact:
        selected_datastore: "{{ target_datastore if target_datastore != '' else (ds_info.datastores | sort(attribute='freeSpace', reverse=True) | first).name }}"

    - name: "3. Hiển thị phương án chọn vị trí lưu trữ"
      ansible.builtin.debug:
        msg:
          - "--> VỊ TRÍ LƯU TRỮ ĐƯỢC LỰA CHỌN:"
          - "Datacenter: {{ target_datacenter }}"
          - "Datastore tối ưu: {{ selected_datastore }}"
...
