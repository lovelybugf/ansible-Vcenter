---
- name: Kich ban tu dong hoa tao moi may ao tren vSphere vCenter
  hosts: localhost
  gather_facts: false
  vars_files:
    - "../group_vars/all.yml"
  vars:
    vm_name: "amigo-web-prod-01"
    vm_cpu: 4
    vm_ram_mb: 8192

  tasks:
    - name: "Thuc thi tao may ao qua Role"
      block:
        - name: "1. Khoi chay Role vmware_provision de tao VM"
          ansible.builtin.include_role:
            name: vmware_provision

      rescue:
        - name: "2. Thuc hien thong bao hoac Rollback khi gap loi"
          ansible.builtin.debug:
            msg: >
              TIEN TRINH TAO MAY AO BI LOI!
              He thong se huy bo tien trinh va khong de lai VM rác.
              Vui long check lai dung luong Datastore, Datacenter, Cluster hoac Network.
...
