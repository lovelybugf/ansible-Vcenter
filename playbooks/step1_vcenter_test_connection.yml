---
# ==============================================================================
# BƯỚC 1: KIỂM TRA KẾT NỐI API VCENTER
# Job Template AWX: 01-vCenter-Test-Connection
# Sử dụng module: community.vmware.vmware_about_info
# ==============================================================================

- name: "[STEP 1] Kiểm tra kết nối vCenter API"
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: "1. Thử nghiệm kết nối vCenter API"
      community.vmware.vmware_about_info:
        validate_certs: false
      register: vcenter_info

    - name: "2. Hiển thị thông tin vCenter kết nối thành công"
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "--> Trạng thái: KẾT NỐI VCENTER THÀNH CÔNG!                "
          - "=========================================================="
          - " Sản phẩm        : {{ vcenter_info.about_info.product_full_name }}"
          - " Phiên bản vSphere: {{ vcenter_info.about_info.version }} (Build {{ vcenter_info.about_info.build }})"
          - " Phiên bản API   : {{ vcenter_info.about_info.api_version }}"
          - " Cổng kết nối API : {{ vcenter_info.about_info.api_type }}"
          - " Hệ điều hành VCSA: {{ vcenter_info.about_info.os_type }}"
          - " vCenter UUID    : {{ vcenter_info.about_info.instance_uuid }}"
...
