---
# ==============================================================================
# BƯỚC 1: KIỂM TRA KẾT NỐI API VCENTER
# Job Template AWX: 01-vCenter-Test-Connection
# Sử dụng Red Hat Certified Collection: vmware.vmware (Module: appliance_info)
# ==============================================================================

- name: "[STEP 1] Kiểm tra kết nối vCenter API"
  hosts: localhost
  gather_facts: false
  connection: local
  collections:
    - vmware.vmware

  tasks:
    - name: "1. Thử nghiệm kết nối vCenter API"
      vmware.vmware.appliance_info:
        validate_certs: false
      register: vcenter_info

    - name: "2. Hiển thị thông tin vCenter kết nối thành công"
      ansible.builtin.debug:
        msg:
          - "--> Trạng thái: KẾT NỐI VCENTER THÀNH CÔNG!"
          - "Thông tin vCenter Appliance: {{ vcenter_info.appliance | default(vcenter_info) }}"
...
