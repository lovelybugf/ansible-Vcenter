---
# ==============================================================================
# BƯỚC 1: KIỂM TRA KẾT NỐI API VCENTER
# Job Template AWX: 01-vCenter-Test-Connection
# Sử dụng tên đầy đủ (FQCN): community.vmware.vmware_about_info
# ==============================================================================

- name: "[STEP 1] Kiểm tra kết nối vCenter API"
  hosts: localhost
  gather_facts: false
  connection: local

  tasks:
    - name: "1. Thử nghiệm kết nối vCenter API"
      community.vmware.vmware_about_info:
        validate_certs: false
      register: vcenter_info

    - name: "2. Hiển thị thông tin vCenter kết nối thành công"
      ansible.builtin.debug:
        msg:
          - "================================================================="
          - "  --> TRẠNG THÁI: KẾT NỐI VCENTER API THÀNH CÔNG!                "
          - "================================================================="
          - " Sản phẩm vCenter  : {{ vcenter_info.about_info.product_full_name | default(vcenter_info.about_info.product_name | default('N/A')) }}"
          - " Phiên bản vSphere : {{ vcenter_info.about_info.version | default('N/A') }} (Build {{ vcenter_info.about_info.build | default('N/A') }})"
          - " Cổng kết nối API  : {{ vcenter_info.about_info.api_type | default('VirtualCenter') }} (vAPI {{ vcenter_info.about_info.api_version | default('N/A') }})"
          - " Nền tảng OS VCSA  : {{ vcenter_info.about_info.os_type | default('linux-x64') }}"
          - " Mã nhận diện UUID : {{ vcenter_info.about_info.instance_uuid | default('N/A') }}"
          - " Nhà phát triển    : {{ vcenter_info.about_info.vendor | default('VMware, Inc.') }}"
          - "================================================================="
...
