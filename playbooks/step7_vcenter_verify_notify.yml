---
# ==============================================================================
# BƯỚC 7: KIỂM TRA MÁY ẢO BẬT ỔN ĐỊNH VÀ GỬI PHẢN HỒI KẾT QUẢ
# Job Template AWX: 07-vCenter-Verify-And-Notify
# Sử dụng tên đầy đủ (FQCN): community.vmware.vmware_guest_info
# ==============================================================================

- name: "[STEP 7] Kiểm tra độ ổn định máy ảo và gửi phản hồi"
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    vm_name_val: "{{ vm_name | default('nampd-demo-vm') }}"
    datacenter_val: "{{ vm_datacenter | default('Amigo') }}"

  tasks:
    - name: "1. Chờ máy ảo lên trạng thái PoweredOn và nhận diện địa chỉ IP (Tối đa 5 phút)"
      community.vmware.vmware_guest_info:
        validate_certs: false
        datacenter: "{{ datacenter_val }}"
        name: "{{ vm_name_val }}"
      register: vm_facts
      until: vm_facts.instance.hw_power_status == "POWERED-ON"
      retries: 15
      delay: 20

    - name: "2. Ghi nhận trạng thái hoạt động thực tế của máy ảo"
      ansible.builtin.set_fact:
        vm_power_state: "{{ vm_facts.instance.hw_power_status }}"
        vm_ip_addr: "{{ vm_facts.instance.ipv4 | default('Đang khởi động dịch vụ mạng') }}"

    - name: "3. Gửi thông báo kết quả khởi tạo"
      ansible.builtin.debug:
        msg:
          - "=========================================================="
          - "  HOÀN TẤT TOÀN BỘ TIẾN TRÌNH TRIỂN KHAI MÁY ẢO RHEL!     "
          - "=========================================================="
          - " Tên máy ảo       : {{ vm_name_val }}"
          - " Trạng thái Nguồn : {{ vm_power_state }}"
          - " Địa chỉ IP       : {{ vm_ip_addr }}"
          - " Kết nối vCenter  : OK"
          - " Tiến trình Boot  : Kickstart ISO RHEL thành công"
          - " Phản hồi thông báo: Đã gửi tín hiệu Success về hệ thống."

    - name: "4. Gửi phản hồi kết quả và đổi trạng thái Ticket sang Resolved trên ManageEngine SDP"
      ansible.builtin.uri:
        url: "https://192.168.51.51:8080/api/v3/requests/{{ sdp_ticket_id }}"
        method: PUT
        validate_certs: false
        status_code: [200, 201]
        headers:
          TECHNICIAN_KEY: "{{ sdp_technician_key | default('B18290AC-128B-4819-A192-881920192A9F') }}"
          Accept: "application/v3+json"
        body_format: json
        body:
          request:
            status:
              name: "Resolved"
            description: "Máy ảo {{ vm_name_val }} đã khởi tạo thành công trên vCenter! IP: {{ vm_ip_addr }}. Trạng thái Vulnerability Management: COMPLIANT."
      when: sdp_ticket_id is defined and (sdp_ticket_id | string | length > 0)
      ignore_errors: true
...
