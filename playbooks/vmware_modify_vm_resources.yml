---
- name: Kich ban tu dong hoa sua doi tai nguyen may ao tren vCenter
  hosts: localhost
  gather_facts: false
  become: false

  vars:
    # Ten may ao can sua doi tai nguyen
    vm_name: "amigo-clone-vm-01"

    # Cau hinh tai nguyen moi muon thiet lap
    vm_cpu_cores: 4                # So luong Core CPU muon cap nhat
    vm_cpu_cores_per_socket: 2     # So core tren moi socket (tuy chon, mac dinh de trong se tu dong)
    vm_memory_mb: 8192             # Dung luong RAM moi tinh bang MB (vi du: 8192 MB = 8 GB)

    # Co cho phep tat/bat lai may ao khi can thiet ap dung thay doi phan cung khong:
    # - true: Tu dong tat nguon, cap nhat cau hinh va bat nguon tro lai (Gay gian doan he thong)
    # - false: Bao loi neu khong the cap nhat truc tiep luc may dang chay khi Hot Add chua duoc kich hoat (Mac dinh an toan)
    vm_allow_power_cycling: false

  tasks:
    - name: "Quy trinh sua doi tai nguyen may ao"
      block:
        - name: "1. Thuc hien thay doi CPU va RAM bang module Certified (vmware.vmware.vm)"
          vmware.vmware.vm:
            hostname: "{{ lookup('env', 'VMWARE_HOST') | default(omit) }}"
            username: "{{ lookup('env', 'VMWARE_USER') | default(omit) }}"
            password: "{{ lookup('env', 'VMWARE_PASSWORD') | default(omit) }}"
            validate_certs: false
            name: "{{ vm_name }}"
            state: present
            cpu:
              cores: "{{ vm_cpu_cores | int }}"
              cores_per_socket: "{{ vm_cpu_cores_per_socket | default(omit, true) }}"
            memory:
              size_mb: "{{ vm_memory_mb | int }}"
            allow_power_cycling: "{{ vm_allow_power_cycling | bool }}"
          register: modify_result

        - name: "2. Hien thi ket qua thay doi tai nguyen"
          ansible.builtin.debug:
            msg:
              - "Sua doi tai nguyen may ao '{{ vm_name }}' hoan tat!"
              - "Ket qua thay doi (Changed): {{ modify_result.changed }}"
              - "So CPU Cores hien tai: {{ modify_result.vm.cpu.num_cpu_cores | default('N/A') }}"
              - "Dung luong RAM hien tai: {{ modify_result.vm.memory.size_mb | default('N/A') }} MB"

      rescue:
        - name: "3. Xu ly va bao loi khi sua doi tai nguyen gap su co"
          ansible.builtin.fail:
            msg: >
              TIEN TRINH SUA DOI TAI NGUYEN MAY AO '{{ vm_name }}' THUYET LAP THAT BAI!
              Luu y: Neu may ao dang bat va khong ho tro tinh nang Hot Add CPU/RAM, ban phai dat 'vm_allow_power_cycling: true' de tu dong tat/bat lai VM, hoac tu tat nguon thu cong truoc khi chay playbook.
...
