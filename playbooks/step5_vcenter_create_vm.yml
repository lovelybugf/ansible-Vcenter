---
# ==============================================================================
# BƯỚC 5: TẠO MÁY ẢO VỚI THÔNG SỐ TÙY CHỈNH (ĐỂ TRỐNG BƯỚC THÊM CARD MẠNG)
# Job Template AWX: 05-vCenter-Create-Custom-VM
# Sử dụng tên đầy đủ (FQCN): community.vmware.vmware_guest
# ==============================================================================

- name: "[STEP 5] Khởi tạo máy ảo tùy chỉnh cấu hình"
  hosts: localhost
  gather_facts: false
  connection: local

  vars:
    vm_name_val: "{{ vm_name | default('nampd-demo-vm') }}"
    datacenter_val: "{{ vm_datacenter | default('Amigo') }}"
    cluster_val: "{{ vm_cluster | default('Amigo 2') }}"
    folder_val: "{{ vm_folder | default('Software-2') }}"
    datastore_val: "{{ selected_datastore | default('vsanDatastore') }}"
    num_cpus_val: "{{ vm_num_cpus | default(2) | int }}"
    memory_mb_val: "{{ vm_memory_mb | default(4096) | int }}"
    disk_size_gb_val: "{{ vm_disk_gb | default(40) | int }}"
    guest_os_id: "{{ vm_guest_id | default('rhel8_64Guest') }}"
    rhel_iso_val: "{{ rhel_iso_path | default('[vsanDatastore] RHEL/rhel-9.3-x86_64-dvd.iso') }}"
    kickstart_iso_val: "{{ kickstart_iso_path | default('[vsanDatastore] RHEL/kickstart.iso') }}"

  tasks:
    - name: "1. Khởi tạo máy ảo với thông số tùy chỉnh (Bao gồm 2 ổ CD-ROM: RHEL OS DVD + Kickstart ISO)"
      community.vmware.vmware_guest:
        validate_certs: false
        name: "{{ vm_name_val }}"
        datacenter: "{{ datacenter_val }}"
        cluster: "{{ cluster_val }}"
        folder: "{{ folder_val }}"
        datastore: "{{ datastore_val }}"
        guest_id: "{{ guest_os_id }}"
        state: poweredoff
        hardware:
          memory_mb: "{{ memory_mb_val }}"
          num_cpus: "{{ num_cpus_val }}"
          scsi: paravirtual
        disk:
          - size_gb: "{{ disk_size_gb_val }}"
            type: thin
            datastore: "{{ datastore_val }}"
        cdrom:
          - type: iso
            iso_path: "{{ rhel_iso_val }}"
            state: present
          - type: iso
            iso_path: "{{ kickstart_iso_val }}"
            state: present
        networks: []
      register: vm_create_res

    - name: "2. Hiển thị kết quả khởi tạo khung máy ảo"
      ansible.builtin.debug:
        msg:
          - "--> KHỞI TẠO KHUNG MÁY ẢO THÀNH CÔNG!"
          - "Tên máy ảo: {{ vm_name_val }}"
          - "Số vCPU: {{ num_cpus_val }}"
          - "Dung lượng RAM: {{ memory_mb_val }} MB"
          - "Dung lượng Disk: {{ disk_size_gb_val }} GB Thin Provisioning"
          - "Ghi chú: Bước thêm Card mạng được để trống chuẩn bị cấu hình sau."
...
