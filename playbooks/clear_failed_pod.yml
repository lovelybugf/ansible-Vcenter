---
- name: Tu dong don dep cac Pod bi loi (Failed) sau 1 ngay (24h)
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    target_namespace: "awx"
    # Thoi gian toi da cho phep Pod loi ton tai: 1 ngay = 86400 giay (24h * 3600s)
    max_age_seconds: 86400

  tasks:
    - name: 1. Tim kiem cac Pod Runner AWX o trang thai Failed (Loi)
      kubernetes.core.k8s_info:
        kind: Pod
        namespace: "{{ target_namespace }}"
        label_selectors:
          - "app.kubernetes.io/managed-by=awx"  # Chi loc dung cac Pod Runner do AWX sinh ra
        field_selectors:
          - status.phase=Failed
      register: failed_pods

    - name: 2. Xoa cac Pod bi loi qua 24h
      kubernetes.core.k8s:
        state: absent
        kind: Pod
        namespace: "{{ target_namespace }}"
        name: "{{ item.metadata.name }}"
      loop: "{{ failed_pods.resources }}"
      when:
        - (now(utc=True) - (item.metadata.creationTimestamp | to_datetime('%Y-%m-%dT%H:%M:%SZ'))).total_seconds() >= (max_age_seconds | int)
      loop_control:
        label: "{{ item.metadata.name }}"
