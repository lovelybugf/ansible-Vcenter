---
# ==============================================================================
# BƯỚC 6: GẮN FILE KICKSTART ISO VÀ BOOT CÀI ĐẶT HỆ ĐIỀU HÀNH RHEL
# Job Template AWX: 06-vCenter-Boot-RHEL-Kickstart
# Ưu tiên Red Hat Certified vmware.vmware, tự động hỗ trợ community.vmware
# ==============================================================================

- name: "[STEP 6] Boot hệ điều hành RHEL bằng tệp Kickstart ISO"
  hosts: localhost
  gather_facts: false
  connection: local
  collections:
    - vmware.vmware
    - community.vmware

  vars:
    vm_name_val: "{{ vm_name | default('rhel-demo-vm') }}"
    iso_path_val: "{{ kickstart_iso_path | default('[datastore1] iso/rhel_kickstart.iso') }}"

  tasks:
    - name: "1. Gắn file ISO Kickstart vào ổ CD-ROM của máy ảo"
      guest:
        validate_certs: false
        name: "{{ vm_name_val }}"
        state: present
        cdrom:
          - type: iso
            iso_path: "{{ iso_path_val }}"
            state: present
      register: cdrom_res

    - name: "2. Khởi động máy ảo (Power On) để bắt đầu tiến trình tự động cài RHEL"
      guest:
        validate_certs: false
        name: "{{ vm_name_val }}"
        state: poweredon
      register: poweron_res

    - name: "3. Hiển thị thông báo tiến trình Boot Kickstart"
      ansible.builtin.debug:
        msg:
          - "--> ĐÃ GẮN ISO KICKSTART VÀ BẬT NGUỒN MÁY ẢO THÀNH CÔNG!"
          - "Tên máy ảo: {{ vm_name_val }}"
          - "Đường dẫn ISO: {{ iso_path_val }}"
          - "Trạng thái nguồn: Powered ON"
...
