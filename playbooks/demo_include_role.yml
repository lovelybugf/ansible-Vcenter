---
- name: "Chung minh include_role ho tro bien dong va vong lap"
  hosts: localhost
  gather_facts: false
  vars:
    my_dynamic_role: "demo_role"
  tasks:
    - name: "1. Goi include_role bang bien dong (Chay thanh cong)"
      ansible.builtin.include_role:
        name: "{{ my_dynamic_role }}"
      vars:
        demo_var: "Gia tri tu bien dong"

    - name: "2. Goi include_role trong vong lap (Chay thanh cong)"
      ansible.builtin.include_role:
        name: demo_role
      vars:
        demo_var: "{{ item }}"
      loop:
        - "Tao"
        - "Chuoi"
...

