---
# ==============================================================================
# WORKLOAD THỰC TẾ: TRIỂN KHAI VÀ GIÁM SÁT APACHE WEB SERVER (CHƯƠNG 6)
# Chạy demo trên máy điều khiển 172.25.250.8 và máy đích 172.25.250.20
#
# CÁC KỊCH BẢN CHẠY DEMO ĐỂ KIỂM TRA THẺ TAGS:
#
# 1. Chạy tất cả cấu hình thông thường (setup và config):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags "setup,config"
#    -> Chỉ chạy cài đặt và đẩy cấu hình + kiểm tra HTTP phản hồi (vì post-tasks có tag 'always').
#
# 2. Chạy tác vụ nguy hiểm reset web server (chỉ chạy khi gọi đích danh):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags "db_reset"
#    -> Task xóa index.html sẽ được chạy (do mang tag 'never' và 'db_reset').
#
# 3. Chạy các tác vụ được gắn thẻ (tagged):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags tagged
#
# 4. Chạy các tác vụ không gắn thẻ (untagged):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags untagged
# ==============================================================================

- name: "Play 1 - Tự động cấu hình Sudo không mật khẩu (NOPASSWD) cho ducnam"
  hosts: web_servers, db_servers
  gather_facts: false
  become: false
  tags: always
  tasks:
    - name: "Ghi cấu hình NOPASSWD vào /etc/sudoers.d/ducnam"
      ansible.builtin.shell: |
        echo "1" | sudo -S sh -c "echo 'ducnam ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/ducnam && chmod 0440 /etc/sudoers.d/ducnam"
      changed_when: true
      ignore_errors: true

- name: "Play 2 - Playbook Triển khai Web Server thực tế - Demo Chương 6"
  hosts: web_servers, db_servers
  gather_facts: true          # Thu thập fact để lấy tên hệ điều hành hiển thị lên trang chủ index.html
  become: true                # LEO THANG QUYỀN: Bật become ở cấp độ Play để các tác vụ sửa đổi hệ thống có quyền root

  # --------------------------------------------------------------------------
  # A. PRE-TASKS: Điều phối gỡ Server khỏi Load Balancer (HAProxy) trước khi triển khai
  # --------------------------------------------------------------------------
  pre_tasks:
    - name: "[PRE-TASK 1] Ghi thông báo khởi động tiến trình lên Control Node"
      ansible.builtin.debug:
        msg: "Bắt đầu tiến trình bảo trì và cập nhật cho máy chủ {{ inventory_hostname }}..."
      delegate_to: localhost
      become: false           # BEST PRACTICE: Bắt buộc tắt become trên localhost để tránh lỗi sudo cục bộ
      tags: always

    - name: "[PRE-TASK 2] Gỡ máy chủ {{ inventory_hostname }} khỏi active rotation của HAProxy"
      ansible.builtin.debug:
        msg: "MOCK API CALL: Đã chuyển máy chủ {{ inventory_hostname }} ({{ ansible_host }}) sang trạng thái MAINTENANCE trên HAProxy (cổng 80)."
      delegate_to: localhost
      become: false
      tags: always            # Phải chạy để đảm bảo an toàn cho hệ thống (luôn gỡ trước khi ngắt service)

  # --------------------------------------------------------------------------
  # B. TASKS CHÍNH: Cài đặt, Cấu hình và Bật dịch vụ thực tế
  # --------------------------------------------------------------------------
  tasks:
    - name: "[TASK 1 - SETUP] Cài đặt gói Apache Web Server (httpd)"
      ansible.builtin.package:
        name: httpd
        state: present
      tags: setup

    - name: "[TASK 1.5 - PORT] Đổi cổng Apache sang 8080 tránh xung đột cổng 80 với HAProxy"
      ansible.builtin.lineinfile:
        path: /etc/httpd/conf/httpd.conf
        regexp: '^Listen 80$'
        line: 'Listen 8080'
      tags:
        - setup
        - config

    - name: "[TASK 2 - CONFIG] Cấu hình trang chủ index.html từ Template"
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        mode: '0644'
      tags: config

    - name: "[TASK 3 - SETUP] Khởi động và kích hoạt dịch vụ Apache (httpd)"
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      notify: Restart Apache
      tags: setup

    - name: "[TASK 3.5 - FLUSH] ÉP RESTART APACHE LẬP TỨC (Flush Handlers)"
      ansible.builtin.meta: flush_handlers  # Ép chạy Restart Apache ngay để kiểm tra ở bước post_tasks tiếp theo
      tags: always

    - name: "[TASK 4 - RESET] Xóa bỏ trang chủ index.html (Tác vụ Nguy hiểm)"
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent
      tags:
        - never               # Chỉ chạy khi chỉ định --tags db_reset
        - db_reset

    - name: "[TASK 5 - UNTAGGED] Tác vụ ghi nhận log local (Không gắn thẻ)"
      ansible.builtin.debug:
        msg: "Ghi nhận: Tiến trình cấu hình đã đi qua các task chính trên {{ inventory_hostname }}."

  # --------------------------------------------------------------------------
  # C. POST-TASKS: Kiểm tra cục bộ và gắn lại Server vào Load Balancer
  # --------------------------------------------------------------------------
  post_tasks:
    - name: "[POST-TASK 1] Kiểm tra phản hồi HTTP thực tế cổng 8080 từ máy Control Node (Health Check)"
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}:8080"
        status_code: 200
        timeout: 5
      delegate_to: localhost  # Đứng từ Control Node gọi HTTP curl kiểm tra
      become: false           # Không cần sudo trên Control Node
      tags: always            # Luôn luôn chạy để xác thực chất lượng trước khi mở lại cho người dùng

    - name: "[POST-TASK 2] Gắn máy chủ {{ inventory_hostname }} trở lại active rotation của HAProxy"
      ansible.builtin.debug:
        msg: "MOCK API CALL: Cấu hình HAProxy mở lại traffic và hướng người dùng đến {{ inventory_hostname }} ({{ ansible_host }}:8080)."
      delegate_to: localhost
      become: false
      tags: always

    - name: "[POST-TASK 3] Kích hoạt 2 handler thông báo và ghi nhận log"
      ansible.builtin.debug:
        msg: "Hoàn tất triển khai. Bắt đầu gửi thông báo Slack và ghi nhận nhật ký deploy..."
      notify:
        - "Gửi tin nhắn Slack"
        - "Ghi log lịch sử"
      changed_when: true      # Bắt buộc thay đổi trạng thái để kích hoạt notify
      tags: always

    - name: "[POST-TASK 4] Ép chạy nóng các Handler thông báo ngay lập tức"
      ansible.builtin.meta: flush_handlers  # Chạy ngay 2 handler trên trước khi hoàn thành Playbook
      tags: always

  # --------------------------------------------------------------------------
  # D. HANDLERS: Xử lý restart dịch vụ và thông báo
  # --------------------------------------------------------------------------
  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: httpd
        state: restarted

    - name: "Gửi tin nhắn Slack"
      ansible.builtin.debug:
        msg: "-> [HANDLER SLACK] Gửi thông báo: Hệ thống {{ inventory_hostname }} đã cập nhật thành công!"

    - name: "Ghi log lịch sử"
      ansible.builtin.debug:
        msg: "-> [HANDLER LOG] Đã ghi nhận nhật ký cập nhật cho {{ inventory_hostname }} vào cơ sở dữ liệu."

