---
# ==============================================================================
# WORKLOAD THỰC TẾ: TRIỂN KHAI VÀ GIÁM SÁT APACHE WEB SERVER (CHƯƠNG 6)
# Chạy demo trên máy điều khiển 172.25.250.8 và máy đích 172.25.250.20
#
# CÁC KỊCH BẢN CHẠY DEMO ĐỂ KIỂM TRA THẺ TAGS:
#
# 1. Chạy tất cả cấu hình thông thường (setup và config):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags "setup,config"
#    -> Chỉ chạy cài đặt và đẩy cấu hình + kiểm tra HTTP phản hồi (vì post-tasks có tag 'always').
#
# 2. Chạy tác vụ nguy hiểm reset web server (chỉ chạy khi gọi đích danh):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags "db_reset"
#    -> Task xóa index.html sẽ được chạy (do mang tag 'never' và 'db_reset').
#
# 3. Chạy các tác vụ được gắn thẻ (tagged):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags tagged
#
# 4. Chạy các tác vụ không gắn thẻ (untagged):
#    ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml --tags untagged
# ==============================================================================

- name: "Playbook Triển khai Web Server thực tế - Demo Chương 6"
  hosts: web_servers, db_servers
  gather_facts: true          # Thu thập fact để lấy tên hệ điều hành hiển thị lên trang chủ index.html

  # --------------------------------------------------------------------------
  # A. PRE-TASKS: Chuẩn bị kiểm tra ban đầu trước khi chạy tasks chính
  # --------------------------------------------------------------------------
  pre_tasks:
    - name: "[PRE-TASK] Ghi thông báo khởi động tiến trình lên Control Node"
      ansible.builtin.debug:
        msg: "Bắt đầu triển khai dịch vụ Apache Web Server..."
      delegate_to: localhost
      become: false           # BEST PRACTICE: Bắt buộc tắt become trên localhost để tránh lỗi sudo cục bộ
      tags: always            # Luôn luôn chạy tác vụ này

  # --------------------------------------------------------------------------
  # B. TASKS CHÍNH: Cài đặt, Cấu hình và Bật dịch vụ thực tế
  # --------------------------------------------------------------------------
  tasks:
    - name: "[TASK 1 - SETUP] Cài đặt gói Apache Web Server (httpd)"
      ansible.builtin.package:
        name: httpd
        state: present
      tags: setup             # Gán tag 'setup'

    - name: "[TASK 2 - CONFIG] Cấu hình trang chủ index.html từ Template"
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: /var/www/html/index.html
        mode: '0644'
      tags: config            # Gán tag 'config'

    - name: "[TASK 3 - SETUP] Khởi động và kích hoạt dịch vụ Apache (httpd)"
      ansible.builtin.service:
        name: httpd
        state: started
        enabled: true
      notify: Restart Apache
      tags: setup             # Gán tag 'setup'

    - name: "[TASK 4 - RESET] Xóa bỏ trang chủ index.html (Tác vụ Nguy hiểm)"
      ansible.builtin.file:
        path: /var/www/html/index.html
        state: absent
      tags:
        - never               # Tag đặc biệt: ngăn không cho tự động chạy khi chạy bình thường
        - db_reset            # Chỉ chạy khi chỉ định --tags db_reset

    - name: "[TASK 5 - UNTAGGED] Tác vụ ghi nhận log local (Không gắn thẻ)"
      ansible.builtin.debug:
        msg: "Ghi nhận: Tiến trình cấu hình đã đi qua các task chính trên {{ inventory_hostname }}."

  # --------------------------------------------------------------------------
  # C. POST-TASKS: Kiểm tra, xác thực dịch vụ và kích hoạt handlers kết thúc
  # --------------------------------------------------------------------------
  post_tasks:
    - name: "[POST-TASK 1] Kiểm tra phản hồi HTTP thực tế từ máy Control Node"
      ansible.builtin.uri:
        url: "http://{{ ansible_host }}"
        status_code: 200
        timeout: 5
      delegate_to: localhost  # Đứng từ Control Node gọi HTTP curl kiểm tra
      become: false           # Không cần sudo trên Control Node
      tags: always            # Tag 'always' đảm bảo bước xác thực này luôn được chạy cuối cùng

    - name: "[POST-TASK 2] Kích hoạt 2 handler thông báo và ghi nhận log"
      ansible.builtin.debug:
        msg: "Hoàn tất kiểm tra HTTP. Bắt đầu gửi thông báo Slack và ghi nhận nhật ký deploy..."
      notify:
        - "Gửi tin nhắn Slack"
        - "Ghi log lịch sử"
      changed_when: true      # Bắt buộc thay đổi trạng thái để kích hoạt notify
      tags: always

    - name: "[POST-TASK 3] Ép chạy nóng các Handler của post-tasks ngay lập tức"
      ansible.builtin.meta: flush_handlers  # Chạy ngay 2 handler trên trước khi hoàn thành Playbook
      tags: always

  # --------------------------------------------------------------------------
  # D. HANDLERS: Xử lý restart dịch vụ và thông báo
  # --------------------------------------------------------------------------
  handlers:
    - name: Restart Apache
      ansible.builtin.service:
        name: httpd
        state: restarted

    - name: "Gửi tin nhắn Slack"
      ansible.builtin.debug:
        msg: "-> [HANDLER SLACK] Gửi thông báo: Hệ thống {{ inventory_hostname }} đã cập nhật thành công!"

    - name: "Ghi log lịch sử"
      ansible.builtin.debug:
        msg: "-> [HANDLER LOG] Đã ghi nhận nhật ký cập nhật cho {{ inventory_hostname }} vào cơ sở dữ liệu."
...
