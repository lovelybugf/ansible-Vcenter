---
# ==============================================================================
# DEMO RÚT GỌN CHƯƠNG 6 (PRIVILEGE, TAGS, PIPELINING & PROFILING)
# Chạy demo trên máy điều khiển 172.25.250.8 và máy đích 172.25.250.20
# Lệnh chạy khuyến nghị: ansible-playbook -i inventory/demo_hosts.yml demo_chapter6.yml
# ==============================================================================

- name: "Playbook Demo rút gọn Chương 6"
  hosts: web_servers, db_servers
  gather_facts: false         # Tối ưu hóa hiệu năng bằng cách tắt Fact Gathering

  tasks:
    # --------------------------------------------------------------------------
    # 1. MINH HỌA KIỂM SOÁT ĐẶC QUYỀN TRÊN LOCALHOST (BECOME: FALSE)
    # --------------------------------------------------------------------------
    - name: "[LOCAL TASK] Gọi API / Tác vụ local trên Control Node"
      ansible.builtin.debug:
        msg: "Chạy local không cần đặc quyền root: delegate_to: localhost và become: false tránh lỗi thiếu lệnh sudo cục bộ"
      delegate_to: localhost
      become: false           # BEST PRACTICE: Bắt buộc tắt become để tránh đòi mật khẩu sudo nội bộ trong Container/Control Node

    # --------------------------------------------------------------------------
    # 2. MINH HỌA FORKS & PIPELINING (HIỆU NĂNG)
    # --------------------------------------------------------------------------
    - name: "[PERFORMANCE] Giải thích Pipelining (Số lần kết nối SSH)"
      ansible.builtin.debug:
        msg: |
          - Không bật Pipelining: Tốn 3 lần kết nối SSH cho mỗi Task (1. SFTP chuyển file python tạm; 2. Chmod file; 3. Chạy file python).
          - Bật Pipelining (pipelining = True trong ansible.cfg): Tốn đúng 1 kết nối duy nhất (truyền trực tiếp code Python qua stdin và thực thi ngay).
          - Forks = 50: Cho phép chạy song song đồng thời trên tối đa 50 host thay vì mặc định chỉ 5 host.

    # --------------------------------------------------------------------------
    # 3. MINH HỌA SPECIAL TAGS (ALWAYS, NEVER, TAGGED/UNTAGGED)
    # --------------------------------------------------------------------------
    - name: "[TAG-ALWAYS] Tác vụ này sẽ luôn luôn chạy"
      ansible.builtin.debug:
        msg: "Task nay mang tag 'always'. No se luon duoc chay bat ke ban dung filter --tags nao (tru khi dung --skip-tags always)"
      tags: always

    - name: "[TAG-NEVER] Tác vụ nguy hiểm / khẩn cấp"
      ansible.builtin.debug:
        msg: "Task nay mang tag 'never'. No se KHÔNG BAO GIỜ chay tu dong, tru khi ban goi dich danh qua --tags never"
      tags:
        - never
        - reset_db

    - name: "[TAG-NORMAL] Tác vụ cấu hình thông thường (Tagged)"
      ansible.builtin.debug:
        msg: "Task nay co tag 'setup'. Co the loc bang --tags setup hoac --tags tagged."
      tags: setup

    - name: "[UNTAGGED TASK] Tác vụ không gắn thẻ (Untagged)"
      ansible.builtin.debug:
        msg: "Task nay khong co tag. Co the loc bang --tags untagged."
...
